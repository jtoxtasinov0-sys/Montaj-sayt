# Dokploy (Docker Compose) yoki istalgan VPS uchun.
# Ishga tushirish:  cp .env.example .env  →  qiymatlarni to'ldiring  →  docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://montaj:${POSTGRES_PASSWORD}@db:5432/montaj
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    # Dokploy'da domen UI orqali ulanadi (Traefik). Oddiy VPS'da test uchun: ports: ["3000:3000"]
    expose:
      - "3000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: montaj
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env da bo'lishi shart}
      POSTGRES_DB: montaj
    command: >
      postgres -c max_connections=100 -c shared_buffers=256MB -c effective_cache_size=768MB
               -c work_mem=8MB -c maintenance_work_mem=64MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U montaj -d montaj"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Ma'lumotlar bazasi tashqariga OCHILMAYDI (ports yo'q) — faqat app ulanadi

volumes:
  pgdata:
  uploads:
